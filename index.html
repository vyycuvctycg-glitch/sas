.grid-container{flex:1;overflow-y:auto;padding:18px 22px 40px;background:radial-gradient(circle at 20% 30%,#1a1e26,#0b0d10 80%)}
.grid-header{display:flex;justify-content:space-between;align-items:center;color:var(--text-dim);font-size:.85rem;margin-bottom:14px}

// ============================================================
//  CHARGEMENT DEPUIS L'API MYINSTANTS
// ============================================================
async function fetchSoundsFromAPI(page = 0, category = '', query = '') {
    let url;
    if (query) {
        url = `${API_BASE}/search?q=${encodeURIComponent(query)}`;
    } else if (category && category !== 'chiki') {
        url = `${API_BASE}/category/${encodeURIComponent(category)}`;
    } else {
        url = `${API_BASE}/trending`;
    }
    
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        
        let sounds = [];
        if (Array.isArray(data)) {
            sounds = data;
        } else if (data.results && Array.isArray(data.results)) {
            sounds = data.results;
        } else if (data.data && Array.isArray(data.data)) {
            sounds = data.data;
        } else if (data.sounds && Array.isArray(data.sounds)) {
            sounds = data.sounds;
        } else if (typeof data === 'object') {
            for (const key in data) {
                if (Array.isArray(data[key]) && data[key].length > 0) {
                    sounds = data[key];
                    break;
                }
            }
        }
        
        return sounds.map(s => ({
            name: s.title || s.name || s.slug || 'Son',
            category: s.category || category || 'meme',
            emoji: '🎵',
            url: s.audioUrl || s.url || s.sound || s.mp3 || s.file
        })).filter(s => s.url);
        
    } catch (err) {
        console.warn('API MyInstants indisponible, fallback local:', err.message);
        return null;
    }
}

// ============================================================
//  AFFICHAGE DES CARTES
// ============================================================
function renderSoundCards(sounds) {
    soundGrid.innerHTML = '';
    if (!sounds || sounds.length === 0) {
        soundGrid.innerHTML = '<div class="loading"><i class="fas fa-search"></i><p>Aucun son trouvé</p></div>';
        return;
    }
    
    sounds.forEach((sound, idx) => {
        const card = document.createElement('div');
        card.className = 'sound-card';
        if (sound.category === 'chiki') {
            card.classList.add('chiki-highlight');
        }
        card.dataset.id = `sound_${currentPage}_${idx}`;
        card.dataset.url = sound.url;
        card.innerHTML = `
            <span class="play-indicator"><i class="fas fa-volume-up"></i></span>
            <span class="emoji">${sound.emoji || '🎵'}</span>
            <span class="name">${sound.name}</span>
            <span class="cat-tag">${sound.category || ''}</span>
        `;
        card.addEventListener('click', () => playSound(card));
        soundGrid.appendChild(card);
    });
    
    resultsCount.textContent = `${sounds.length} sons affichés`;
    totalSoundsEl.textContent = sounds.length;
}

// ============================================================

function playSound(card) {
    const url = card.dataset.url;
    if (!url) return;
    
    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
    }
    
    document.querySelectorAll('.sound-card.playing').forEach(el => el.classList.remove('playing'));
    card.classList.add('playing');
    
    currentAudio = new Audio(url);
    currentAudio.volume = parseFloat(volumeSlider.value);
    currentAudio.play().catch(e => {
        console.warn('Lecture bloquée:', e);
        nowPlayingTitle.textContent = '⚠️ Cliquez à nouveau pour activer le son';
    });
    
    const name = card.querySelector('.name').textContent;
    const emoji = card.querySelector('.emoji').textContent;
    nowPlayingTitle.textContent = `${emoji} ${name}`;
    currentPlayingId = card.dataset.id;
    isPlaying = true;
    updatePlayPauseIcon();
    
    currentAudio.addEventListener('ended', () => {
        isPlaying = false;
        updatePlayPauseIcon();
        card.classList.remove('playing');
        nowPlayingTitle.textContent = 'Aucun son sélectionné';
        currentPlayingId = null;
        currentAudio = null;
    });
    
    currentAudio.addEventListener('error', () => {
        console.warn('Erreur audio:', url);
        card.classList.remove('playing');
        nowPlayingTitle.textContent = '❌ Impossible de charger ce son';
    });
}

function updatePlayPauseIcon() {
    const icon = playPauseBtn.querySelector('i');
    icon.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
}

// ============================================================
//  CONTRÔLES
// ============================================================
playPauseBtn.addEventListener('click', () => {
    if (!currentAudio) return;
    if (isPlaying) {
        currentAudio.pause();
        isPlaying = false;
    } else {
        currentAudio.play();
        isPlaying = true;
    }
    updatePlayPauseIcon();
});

volumeSlider.addEventListener('input', (e) => {
    if (currentAudio) currentAudio.volume = parseFloat(e.target.value);
});

searchBtn.addEventListener('click', () => {
    currentSearch = searchInput.value.trim();
    currentCategory = '';
    currentPage = 0;
    activeFilter.textContent = currentSearch || 'Recherche';
    loadSounds();
});

searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        searchBtn.click();
    }
});

categoryContainer.addEventListener('click', (e) => {
    const btn = e.target.closest('.cat-btn');
    if (!btn) return;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = btn.dataset.cat;
    currentSearch = '';
    currentPage = 0;
    activeFilter.textContent = btn.textContent.trim();
    loadSounds();
});

loadMoreBtn.addEventListener('click', () => {
    currentPage++;
    loadSounds(true);
});

// ============================================================
//  CHARGEMENT PRINCIPAL
// ============================================================
async function loadSounds(append = false) {
    if (!append) {
        soundGrid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Chargement...</p></div>';
    }
    
    let sounds = null;
    
    // Si catégorie chiki, on charge les sons dédiés
    if (currentCategory === 'chiki') {
        sounds = CHIKI_SOUNDS;
    } else if (currentSearch && currentSearch.toLowerCase().includes('chiki')) {
        // Recherche chiki → mélanger les sons chiki avec les résultats API
        const apiSounds = await fetchSoundsFromAPI(0, '', currentSearch);
        sounds = [...CHIKI_SOUNDS, ...(apiSounds || [])];
    } else {
        try {
            sounds = await fetchSoundsFromAPI(currentPage, currentCategory, currentSearch);
        } catch (e) {
            console.warn('API failed:', e);
        }
    }
    
    // Fallback local si l'API ne répond pas
    if (!sounds || sounds.length === 0) {
        sounds = FALLBACK_SOUNDS.filter(s => {
            if (currentSearch) return s.name.toLowerCase().includes(currentSearch.toLowerCase());
            if (currentCategory) return s.category === currentCategory;
            return true;
        });
        
        if (sounds.length === 0) {
            sounds = FALLBACK_SOUNDS;
        }
    }
    
    // Pagination
    const start = currentPage * SOUNDS_PER_PAGE;
    const end = start + SOUNDS_PER_PAGE;
    const pageSounds = sounds.slice(start, end);
    
    if (!append) {
        allLoadedSounds = sounds;
        renderSoundCards(pageSounds);
    } else {
        pageSounds.forEach((sound, idx) => {
            const card = document.createElement('div');
            card.className = 'sound-card';
            if (sound.category === 'chiki') {
                card.classList.add('chiki-highlight');
            }
            card.dataset.id = `sound_${currentPage}_${idx}`;
            card.dataset.url = sound.url;
            card.innerHTML = `
                <span class="play-indicator"><i class="fas fa-volume-up"></i></span>
                <span class="emoji">${sound.emoji || '🎵'}</span>
                <span class="name">${sound.name}</span>
                <span class="cat-tag">${sound.category || ''}</span>
            `;
            card.addEventListener('click', () => playSound(card));
            soundGrid.appendChild(card);
        });
        resultsCount.textContent = `${soundGrid.children.length} sons affichés`;
    }
    
    loadMoreContainer.style.display = end < sounds.length ? 'flex' : 'none';
    loadMoreBtn.innerHTML = `<i class="fas fa-chevron-down"></i> Charger plus (${Math.max(0, sounds.length - end)} restants)`;
}

// ============================================================
//  DÉMARRAGE
// ============================================================
loadSounds();
console.log('NEXUSPLAY MAX initialisé · Chiki Briki activé 🇷🇺');
</script>
</body>
</html>
